name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    
    - name: Restore dependencies
      run: dotnet restore AiMergeTool.sln
    
    - name: Build
      run: dotnet build AiMergeTool.sln --configuration Release --no-restore
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: AiMergeTool-Release
        path: |
          AiMergeTool/bin/Release/net8.0-windows/
          !AiMergeTool/bin/Release/net8.0-windows/*.pdb
        retention-days: 30
