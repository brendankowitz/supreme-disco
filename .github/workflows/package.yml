name: Package and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    
    - name: Restore dependencies
      run: dotnet restore AiMergeTool.sln
    
    - name: Build Release
      run: dotnet build AiMergeTool.sln --configuration Release --no-restore
    
    - name: Create NuGet Package
      run: dotnet pack AiMergeTool/AiMergeTool.csproj --configuration Release --no-build --output ./nupkgs
    
    - name: Publish Build
      run: dotnet publish AiMergeTool/AiMergeTool.csproj -c Release -r win-x64 --self-contained false -o ./publish
    
    - name: Create ZIP Archive
      shell: pwsh
      run: Compress-Archive -Path ./publish/* -DestinationPath AiMergeTool-win-x64.zip
    
    - name: Upload NuGet Package Artifact
      uses: actions/upload-artifact@v3
      with:
        name: nuget-package
        path: nupkgs/*.nupkg
        retention-days: 90
    
    - name: Upload Release Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: release-build
        path: AiMergeTool-win-x64.zip
        retention-days: 90
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          nupkgs/*.nupkg
          AiMergeTool-win-x64.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
